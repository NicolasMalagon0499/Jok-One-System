<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Inventario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h3>Agregar producto</h3>

  <ion-item>
    <ion-label position="floating">Nombre</ion-label>
    <ion-input type="text" [(ngModel)]="newProduct.name"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Descripción</ion-label>
    <ion-input type="text" [(ngModel)]="newProduct.description"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Stock</ion-label>
    <ion-input type="number" [(ngModel)]="newProduct.stock"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Precio de venta</ion-label>
    <ion-input type="number" [(ngModel)]="newProduct.salePrice"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Precio de costo</ion-label>
    <ion-input type="number" [(ngModel)]="newProduct.costPrice"></ion-input>
  </ion-item>

  <ion-button expand="block" (click)="createProduct()" style="margin-top: 20px">
    Crear producto
  </ion-button>

  <h3>Productos</h3>

  <ion-card *ngFor="let p of products">
    <ion-card-header>
      <ion-card-title>{{ p.name }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>📦 Stock: {{ p.stock }}</p>
      <p>💰 Precio venta: {{ p.salePrice }}</p>
      <p>💵 Precio costo: {{ p.costPrice }}</p>
      <p *ngIf="p.description">📝 {{ p.description }}</p>
    </ion-card-content>
  </ion-card>

</ion-content>
