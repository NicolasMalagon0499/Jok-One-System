<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="header-wrapper">
      <div class="header-start"></div>
      <div class="logo-container">
        <img src="assets/logo.png" alt="Jok One" class="topbar-logo">
      </div>
      <div class="header-end">
        <app-theme-toggle></app-theme-toggle>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  
    <h1 class="login-title">Bienvenido</h1>
    <p class="login-subtitle">Inicia sesión para continuar</p>

    <!-- Un <form> real con ngSubmit (en vez de un botón suelto con (click))
         es lo que permite que Android ofrezca guardar y luego autocompletar
         el usuario/contraseña — es el gestor de contraseñas del teléfono el
         que se encarga, no guardamos nosotros la clave en ningún lado. -->
    <form (ngSubmit)="login()">
      <ion-item class="input-group" lines="none">
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input
          type="email"
          name="email"
          [(ngModel)]="email"
          autocomplete="username">
        </ion-input>
      </ion-item>

      <ion-item class="input-group" lines="none">
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password">
        </ion-input>
      </ion-item>

      <p *ngIf="error" class="error-msg">⚠️ {{ error }}</p>

      <ion-button
        expand="block"
        type="submit"
        class="btn-login"
        [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">Iniciar Sesión</span>
      </ion-button>
    </form>

</ion-content>
