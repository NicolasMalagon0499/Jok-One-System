version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en backend/.env}
      POSTGRES_DB: barberia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en backend/.env}@db:5432/barberia
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en backend/.env}
    depends_on:
      - db

volumes:
  postgres_data: